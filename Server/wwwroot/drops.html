<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掉落表管理 - 皓石传奇三管理后台</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-input, .form-select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 0.875rem;
      width: 100%;
      box-sizing: border-box;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-input[readonly] {
      background: var(--bg-secondary);
      cursor: not-allowed;
    }
    .form-select {
      min-width: 150px;
    }
    textarea.form-input {
      resize: vertical;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }
    .pagination button {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .pagination button:hover:not(:disabled) {
      background: var(--bg-primary);
      border-color: var(--primary);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pagination button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .pagination span {
      color: var(--text-tertiary);
      font-size: 0.875rem;
    }
    .item-type {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .item-type.weapon { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .item-type.armour { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .item-type.helmet { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .item-type.necklace { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
    .item-type.bracelet { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .item-type.ring { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .item-type.potion, .item-type.consumable { background: rgba(14, 165, 233, 0.2); color: #0ea5e9; }
    .item-type.default { background: rgba(107, 114, 128, 0.2); color: #6b7280; }

    .action-btns {
      display: flex;
      gap: 0.5rem;
    }
    .btn-icon {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
      position: relative;
      background: var(--bg-secondary);
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .modal-content.modal-large {
      max-width: 800px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
    }
    .modal-close:hover {
      color: var(--text-primary);
    }
    .modal-body {
      padding: 1.5rem;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    /* Form styles */
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-grid {
      display: grid;
      gap: 1.5rem;
    }
    .form-section {
      background: var(--bg-tertiary);
      padding: 1rem;
      border-radius: 8px;
    }
    .form-section-title {
      margin: 0 0 1rem 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .form-row .form-group {
      margin-bottom: 0.5rem;
    }
    .form-row .form-group.full-width {
      grid-column: span 2;
    }
    .checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* affixes 专用补充 */
    .form-control { width: 100%; }
    .form-control, .form-input, .form-select { background: var(--bg-secondary, transparent); }
    .mono { font-family: Consolas, monospace; }
    .param-row, .effect-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .param-row input, .effect-row select, .effect-row input { width: auto; }
    .affix-preview { padding: 0.75rem; border: 1px dashed var(--border-color); border-radius: 6px; color: var(--text-secondary); min-height: 2.5rem; }
    .badge-on { color: var(--success); }
    .badge-off { color: var(--error); }
    /* drops 专用补充 */
    .form-control { width: 100%; color: #fff; }
    .form-control, .form-input, .form-select { color: #fff; }
    #editModal input[type="text"], #editModal input[type="number"], #editModal select { color: #fff; }
    #editModal input::placeholder { color: rgba(255, 255, 255, 0.35); }
    .mono { font-family: Consolas, monospace; }
    .hint { color: var(--text-tertiary); font-size: 0.8rem; }
    .picker-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 0.5rem; }
    .picker-item { padding: 0.5rem 0.75rem; cursor: pointer; display: flex; justify-content: space-between; }
    .picker-item:hover { background: var(--bg-tertiary); }
    .picker-item.selected { background: var(--primary); color: #fff; }
  </style>
</head>

        <!-- 掉落表 -->
        <div class="card animate-in" style="margin-top: 1.25rem;">
          <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="card-title">掉落配置</h3>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <input type="text" id="itemSearch" class="form-control" placeholder="按物品名过滤" style="width: 180px;" onkeydown="if(event.key==='Enter') loadDrops(1)">
              <select id="typeFilter" class="form-select" onchange="loadDrops(1)" style="min-width: 130px;">
                <option value="">全部类型</option>
              </select>
              <button class="btn btn-secondary btn-sm" onclick="loadDrops(1)">过滤</button>
              <button class="btn btn-danger btn-sm" id="batchDeleteBtn" onclick="batchDelete()" disabled>批量删除</button>
              <button class="btn btn-primary btn-sm" onclick="showEditModal(null)">+ 新增掉落</button>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width:32px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                    <th>ID</th>
                    <th>怪物</th>
                    <th>物品</th>
                    <th>概率</th>
                    <th>数量</th>
                    <th>掉落组</th>
                    <th>仅部件</th>
                    <th>活动限定</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="dropTableBody">
                  <tr><td colspan="10" style="text-align: center; color: var(--text-tertiary);">请先选择怪物</td></tr>
                </tbody>
              </table>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>

  <div class="modal" id="editModal">
    <div class="modal-backdrop" onclick="closeEditModal()"></div>
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">新增掉落</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>怪物（当前已选）</label>
          <input type="text" class="form-control" id="f_monster" readonly>
        </div>
        <div class="form-group">
          <label>掉落物品 * <span class="hint">输入名称搜索后点击选择</span></label>
          <input type="text" id="itemPickerSearch" class="form-control" placeholder="搜索物品名称" oninput="searchPickItems()">
          <div class="picker-list" id="itemPickerList"></div>
          <input type="hidden" id="f_itemIndex">
          <div id="pickedItemLabel" style="margin-top: 0.35rem; color: var(--warning);"></div>
        </div>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1;">
            <label>概率分母 * <span class="hint">越大越难掉，概率≈1/该值（受倍率影响）</span></label>
            <input type="number" id="f_chance" class="form-control" value="100" min="1">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>数量 *</label>
            <input type="number" id="f_amount" class="form-control" value="1" min="1">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>掉落组 DropSet <span class="hint">0=默认；须为怪物 DropSet 的子集</span></label>
            <input type="number" id="f_dropset" class="form-control" value="0">
          </div>
        </div>
        <div style="display: flex; gap: 2rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem;"><input type="checkbox" id="f_partonly"> 仅掉落部件（PartOnly）</label>
          <label style="display: flex; align-items: center; gap: 0.4rem;"><input type="checkbox" id="f_easter"> 复活节活动限定</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
        <button class="btn btn-primary" onclick="saveDrop()">保存</button>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentMonster = null;   // {index, name}
    let currentPage = 1;
    let totalPages = 1;
    const pageSize = 50;
    let editingIndex = null;
    let monsterSearchTimer = null, itemSearchTimer = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth()) { window.location.href = 'index.html'; return; }
      loadUserInfo();
      loadMonsterOptions();
      loadItemTypes();
    });

    function loadUserInfo() {
      const user = getUser();
      if (user) {
        document.getElementById('userName').textContent = user.email.split('@')[0];
        document.getElementById('userRole').textContent = user.identity;
        document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
      }
    }

    // ---------- 怪物选择 ----------

    async function loadItemTypes() {
      try {
        const types = await api.get('/api/game/items/types');
        const sel = document.getElementById('typeFilter');
        (types || []).forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.value;
          opt.textContent = t.label + ' (' + t.value + ')';
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error('加载物品类型失败:', e);
      }
    }
    async function loadMonsterOptions() {
      const search = document.getElementById('monsterSearch').value.trim();
      const listEl = document.getElementById('monsterList');
      try {
        const data = await api.get('/api/game/drops/monsters' + (search ? `?search=${encodeURIComponent(search)}` : ''));
        const monsters = data.monsters || [];
        if (monsters.length === 0) { listEl.innerHTML = '<div class="picker-item">无匹配怪物</div>'; listEl.style.display = ''; return; }
        listEl.innerHTML = monsters.map(m =>
          `<div class="picker-item" onclick="selectMonster(${m.index}, '${escapeHtml(m.name).replace(/'/g, "\\'")}')"><span>${escapeHtml(m.name)}</span><span class="hint">Lv.${m.level} #${m.index}</span></div>`).join('');
        listEl.style.display = '';
      } catch (e) {
        listEl.innerHTML = `<div class="picker-item" style="color:var(--error);">加载失败: ${e.message}</div>`;
        listEl.style.display = '';
      }
    }

    function selectMonster(index, name) {
      currentMonster = { index, name };
      document.getElementById('currentMonsterLabel').textContent = `${name} (#${index})`;
      document.getElementById('monsterList').style.display = 'none';
      document.getElementById('monsterSearch').value = name;
      loadDrops(1);
    }

    // ---------- 掉落表 ----------
    async function loadDrops(page) {
      if (!currentMonster) { alert('请先选择怪物'); return; }
      currentPage = page || 1;
      try {
        const itemType = document.getElementById('typeFilter').value;
        const itemSearch = document.getElementById('itemSearch').value.trim();
        const data = await api.get(`/api/game/drops?page=${currentPage}&pageSize=${pageSize}&monsterIndex=${currentMonster.index}` + (itemSearch ? `&itemSearch=${encodeURIComponent(itemSearch)}` : '') + (itemType ? `&itemType=${encodeURIComponent(itemType)}` : ''));
        totalPages = data.totalPages || 1;
        renderTable(data.drops || []);
        renderPagination();
      } catch (error) {
        document.getElementById('dropTableBody').innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--error);">加载失败: ${error.message}</td></tr>`;
      }
    }

    function renderTable(drops) {
      if (drops.length === 0) {
        document.getElementById('dropTableBody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-tertiary);">该怪物暂无掉落配置，点击右上角新增</td></tr>';
        return;
      }
      document.getElementById('dropTableBody').innerHTML = drops.map(d => `<tr>
        <td><input type="checkbox" class="row-check" value="${d.index}" onclick="updateBatchBtn()"></td>
        <td>${d.index}</td>
        <td>${escapeHtml(d.monsterName)}</td>
        <td><b>${escapeHtml(d.itemName)}</b> <span class="hint">${escapeHtml(d.itemType)}</span></td>
        <td class="mono">${escapeHtml(d.probabilityHint)}</td>
        <td>${d.amount}</td>
        <td>${d.dropSet}</td>
        <td>${d.partOnly ? '是' : '-'}</td>
        <td>${d.easterEvent ? '是' : '-'}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick='showEditModal(${JSON.stringify(d)})'>编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteDrop(${d.index}, '${escapeHtml(d.itemName).replace(/'/g, "\\'")}')">删除</button>
        </td>
      </tr>`).join('');
    }

    function renderPagination() {
      const el = document.getElementById('pagination');
      let html = '';
      for (let i = 1; i <= totalPages; i++) html += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadDrops(${i})">${i}</button>`;
      el.innerHTML = html;
    }

    // ---------- 编辑弹窗 ----------
    function showEditModal(drop) {
      if (!currentMonster) { alert('请先选择怪物'); return; }
      editingIndex = drop ? drop.index : null;
      document.getElementById('modalTitle').textContent = drop ? `编辑掉落 #${drop.index}` : '新增掉落';
      document.getElementById('f_monster').value = `${currentMonster.name} (#${currentMonster.index})`;
      document.getElementById('f_chance').value = drop ? drop.chance : 100;
      document.getElementById('f_amount').value = drop ? drop.amount : 1;
      document.getElementById('f_dropset').value = drop ? drop.dropSet : 0;
      document.getElementById('f_partonly').checked = drop ? drop.partOnly : false;
      document.getElementById('f_easter').checked = drop ? drop.easterEvent : false;
      document.getElementById('f_itemIndex').value = drop ? drop.itemIndex : '';
      document.getElementById('pickedItemLabel').textContent = drop ? `已选物品：${drop.itemName} (#${drop.itemIndex})` : '';
      document.getElementById('itemPickerSearch').value = '';
      document.getElementById('itemPickerList').innerHTML = '';
      document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() { document.getElementById('editModal').classList.remove('show'); }

    function searchPickItems() {
      clearTimeout(itemSearchTimer);
      itemSearchTimer = setTimeout(async () => {
        const search = document.getElementById('itemPickerSearch').value.trim();
        if (!search) { document.getElementById('itemPickerList').innerHTML = ''; return; }
        try {
          const data = await api.get(`/api/game/items?page=1&pageSize=30&search=${encodeURIComponent(search)}`);
          const items = data.items || [];
          document.getElementById('itemPickerList').innerHTML = items.length === 0
            ? '<div class="picker-item">无匹配物品</div>'
            : items.map(it => `<div class="picker-item" onclick="pickItem(${it.index}, '${escapeHtml(it.name).replace(/'/g, "\\'")}')"><span>${escapeHtml(it.name)}</span><span class="hint">${escapeHtml(it.type)} #${it.index}</span></div>`).join('');
        } catch (e) {
          document.getElementById('itemPickerList').innerHTML = `<div class="picker-item" style="color:var(--error);">${e.message}</div>`;
        }
      }, 300);
    }

    function pickItem(index, name) {
      document.getElementById('f_itemIndex').value = index;
      document.getElementById('pickedItemLabel').textContent = `已选物品：${name} (#${index})`;
      document.getElementById('itemPickerList').innerHTML = '';
      document.getElementById('itemPickerSearch').value = name;
    }

    async function saveDrop() {
      const itemIndex = parseInt(document.getElementById('f_itemIndex').value) || 0;
      if (!itemIndex) { alert('请先选择掉落物品'); return; }
      const body = {
        monsterIndex: currentMonster.index,
        itemIndex: itemIndex,
        chance: parseInt(document.getElementById('f_chance').value) || 0,
        amount: parseInt(document.getElementById('f_amount').value) || 1,
        dropSet: parseInt(document.getElementById('f_dropset').value) || 0,
        partOnly: document.getElementById('f_partonly').checked,
        easterEvent: document.getElementById('f_easter').checked,
      };
      try {
        const res = editingIndex === null
          ? await api.post('/api/game/drops', body)
          : await api.put(`/api/game/drops/${editingIndex}`, body);
        alert(res.message || '保存成功');
        closeEditModal();
        await loadDrops(currentPage);
      } catch (error) {
        alert('保存失败: ' + error.message);
      }
    }

    async function deleteDrop(index, itemName) {
      if (!confirm(`确定删除 [${itemName}] 的掉落配置？`)) return;
      try {
        const res = await api.delete(`/api/game/drops/${index}`);
        alert(res.message || '删除成功');
        await loadDrops(currentPage);
      } catch (error) {
        alert('删除失败: ' + error.message);
      }
    }

    function toggleSelectAll(cb) {
      document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked);
      updateBatchBtn();
    }

    function updateBatchBtn() {
      const anyChecked = document.querySelectorAll('.row-check:checked').length > 0;
      document.getElementById('batchDeleteBtn').disabled = !anyChecked;
    }

    async function batchDelete() {
      const ids = Array.from(document.querySelectorAll('.row-check:checked')).map(c => parseInt(c.value));
      if (!ids.length) return;
      if (!confirm(`确定批量删除 ${ids.length} 条掉落配置？`)) return;
      try {
        const res = await api.post('/api/game/drops/batch-delete', { indexes: ids });
        alert(res.message || '删除成功');
        await loadDrops(currentPage);
      } catch (error) {
        alert('删除失败: ' + error.message);
      }
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
