<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词条概率配置 - 皓石传奇三管理后台</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-input, .form-select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 0.875rem;
      width: 100%;
      box-sizing: border-box;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-input[readonly] {
      background: var(--bg-secondary);
      cursor: not-allowed;
    }
    .form-select {
      min-width: 150px;
    }
    textarea.form-input {
      resize: vertical;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }
    .pagination button {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .pagination button:hover:not(:disabled) {
      background: var(--bg-primary);
      border-color: var(--primary);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pagination button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .pagination span {
      color: var(--text-tertiary);
      font-size: 0.875rem;
    }
    .item-type {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .item-type.weapon { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .item-type.armour { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .item-type.helmet { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .item-type.necklace { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
    .item-type.bracelet { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .item-type.ring { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .item-type.potion, .item-type.consumable { background: rgba(14, 165, 233, 0.2); color: #0ea5e9; }
    .item-type.default { background: rgba(107, 114, 128, 0.2); color: #6b7280; }

    .action-btns {
      display: flex;
      gap: 0.5rem;
    }
    .btn-icon {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
      position: relative;
      background: var(--bg-secondary);
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .modal-content.modal-large {
      max-width: 800px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
    }
    .modal-close:hover {
      color: var(--text-primary);
    }
    .modal-body {
      padding: 1.5rem;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    /* Form styles */
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-grid {
      display: grid;
      gap: 1.5rem;
    }
    .form-section {
      background: var(--bg-tertiary);
      padding: 1rem;
      border-radius: 8px;
    }
    .form-section-title {
      margin: 0 0 1rem 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .form-row .form-group {
      margin-bottom: 0.5rem;
    }
    .form-row .form-group.full-width {
      grid-column: span 2;
    }
    .checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* affixes 专用补充 */
    .form-control { width: 100%; }
    .form-control, .form-input, .form-select { background: var(--bg-secondary, transparent); color: #fff; }
    .mono { font-family: Consolas, monospace; }
    #editModal input[type="text"], #editModal input[type="number"], #editModal select, #editModal textarea { color: #fff; }
    #editModal input::placeholder, #editModal textarea::placeholder { color: rgba(255, 255, 255, 0.35); }
    .param-row, .effect-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .param-row input, .effect-row select, .effect-row input { width: auto; }
    .affix-preview { padding: 0.75rem; border: 1px dashed var(--border-color); border-radius: 6px; color: var(--text-secondary); min-height: 2.5rem; }
    .badge-on { color: var(--success); }
    .badge-off { color: var(--error); }

    .form-control, .form-input, .form-select { color: #fff; background: var(--bg-secondary, transparent); }
    .form-control { width: 100%; }
    .count-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.6rem; }
    .count-row input { width: 110px; }
    .hint { color: var(--text-tertiary); font-size: 0.8rem; }
  </style>
</head>

  <script>
    const rarityOrder = ['Common', 'Superior', 'Elite', 'Famous', 'Divine', 'Heavenly'];
    let config = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth()) { window.location.href = 'index.html'; return; }
      loadUserInfo();
      await loadConfig();
    });

    function loadUserInfo() {
      const user = getUser();
      if (user) {
        document.getElementById('userName').textContent = user.email.split('@')[0];
        document.getElementById('userRole').textContent = user.identity;
        document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
      }
    }

    async function loadConfig() {
      try {
        config = await api.get('/api/game/affixconfig');
        document.getElementById('dc_superior').value = config.dropChances.superior;
        document.getElementById('dc_elite').value = config.dropChances.elite;
        document.getElementById('dc_famous').value = config.dropChances.famous;
        document.getElementById('dc_divine').value = config.dropChances.divine;
        document.getElementById('dc_heavenly').value = config.dropChances.heavenly;

        const titleMap = {};
        (config.affixCounts || []).forEach(r => titleMap[r.rarity] = r.title);
        document.getElementById('countTableBody').innerHTML = rarityOrder.map(r => {
          const row = (config.affixCounts || []).find(x => x.rarity === r) || { chance: 100, min: 0, max: 0 };
          return `<tr>
            <td><b>${titleMap[r] || r}</b> <span class="hint">${r}</span></td>
            <td><input type="number" class="form-control ac-chance" data-r="${r}" value="${row.chance}" min="0" max="100" style="width:110px;"></td>
            <td><input type="number" class="form-control ac-min" data-r="${r}" value="${row.min}" min="0" max="10" style="width:110px;"></td>
            <td><input type="number" class="form-control ac-max" data-r="${r}" value="${row.max}" min="0" max="10" style="width:110px;"></td>
          </tr>`;
        }).join('');
      } catch (e) {
        alert('加载失败: ' + e.message);
      }
    }

    async function saveConfig() {
      const body = {
        dropChances: {
          superior: parseInt(document.getElementById('dc_superior').value) || 0,
          elite: parseInt(document.getElementById('dc_elite').value) || 0,
          famous: parseInt(document.getElementById('dc_famous').value) || 0,
          divine: parseInt(document.getElementById('dc_divine').value) || 0,
          heavenly: parseInt(document.getElementById('dc_heavenly').value) || 0,
        },
        affixCounts: rarityOrder.map(r => ({
          rarity: r,
          chance: parseInt(document.querySelector(`.ac-chance[data-r="${r}"]`).value) || 0,
          min: parseInt(document.querySelector(`.ac-min[data-r="${r}"]`).value) || 0,
          max: parseInt(document.querySelector(`.ac-max[data-r="${r}"]`).value) || 0,
        })),
      };
      try {
        const res = await api.put('/api/game/affixconfig', body);
        alert(res.message || '保存成功');
      } catch (error) {
        alert('保存失败: ' + error.message);
      }
    }
  </script>
</body>
</html>
